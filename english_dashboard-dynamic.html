/* Frozen table headers:
   The page scrolls vertically, while each table wrapper scrolls horizontally only.

   vertical sticky reference, so the header can stay pinned below the app topbar. */
.table-scroll-x{overflow:auto clip;}
.table-scroll-x thead,
.table-scroll-x thead th{position:static !important;}
/* Profile layout: teacher field is always left, coordinator field always right. */

/* JS fallback header overlay for tables that also need horizontal scrolling. */
