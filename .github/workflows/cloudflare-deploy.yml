# Manual-only deployment. No push, pull_request, or schedule trigger.
# IMPORTANT: configure GitHub Environment "production" with required reviewers BEFORE
# adding Cloudflare secrets or running this workflow. Preview deploys are intentionally
# disabled because the app bundle currently uses the production Firebase project.
name: Cloudflare Pages deploy (manual)
on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch, tag, or full commit SHA to build/deploy"
        required: true
        type: string
      target:
        description: "Only production deployment is enabled; it requires environment approval"
        required: true
        type: choice
        options: [production]
      confirm:
        description: "Type the exact 40-character commit SHA to authorize production"
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: cloudflare-pages-production
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.sha.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - id: sha
        shell: bash
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Validate exact release SHA (inputs passed via environment, not shell interpolation)
        env:
          TARGET: ${{ inputs.target }}
          CONFIRM_SHA: ${{ inputs.confirm }}
          RESOLVED_SHA: ${{ steps.sha.outputs.sha }}
        shell: bash
        run: scripts/release-gate.sh "$TARGET" "$CONFIRM_SHA" "$RESOLVED_SHA"
      - name: Test release gate fail-closed behavior
        shell: bash
        run: bash scripts/test-release-gate.sh
      - name: Build allowlisted distribution
        shell: bash
        run: scripts/build-dist.sh dist
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          if-no-files-found: error
  production:
    needs: build
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - name: Deploy exact approved build to Cloudflare Pages production
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          RELEASE_SHA: ${{ needs.build.outputs.sha }}
        shell: bash
        run: npx --yes wrangler@3 pages deploy dist --project-name=ss-progress-track --branch=main --commit-hash="$RELEASE_SHA"
