# MANUAL-ONLY Cloudflare Pages deploy. There is deliberately NO push / pull_request / schedule trigger:
# commits, branches, PRs and merges can never start a deployment.
# Needs repo secrets: CLOUDFLARE_API_TOKEN (Pages:Edit), CLOUDFLARE_ACCOUNT_ID.
name: Cloudflare Pages deploy (manual)
on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch, tag or full commit SHA to deploy"
        required: true
      target:
        description: "preview (safe URL) or production (live URL)"
        required: true
        type: choice
        options: [preview, production]
        default: preview
      confirm:
        description: "Production only: type the exact 40-char commit SHA being deployed"
        required: false
        default: ""
permissions:
  contents: read
concurrency:
  group: cloudflare-pages-deploy
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.sha.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - id: sha
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Gate (production needs the exact SHA typed)
        run: scripts/release-gate.sh "${{ inputs.target }}" "${{ inputs.confirm }}" "$(git rev-parse HEAD)"
      - run: scripts/build-dist.sh dist
      - uses: actions/upload-artifact@v4
        with: { name: dist, path: dist, if-no-files-found: error }
  preview:
    if: inputs.target == 'preview'
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { name: dist, path: dist }
      - name: Deploy to a PREVIEW branch URL only
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@3 pages deploy dist --project-name=ss-progress-track --branch="preview-${{ needs.build.outputs.sha }}" --commit-hash="${{ needs.build.outputs.sha }}"
  production:
    if: inputs.target == 'production'
    needs: build
    runs-on: ubuntu-latest
    environment: production   # owner must add "Required reviewers" on this environment in GitHub settings
    steps:
      - uses: actions/download-artifact@v4
        with: { name: dist, path: dist }
      - name: Deploy to PRODUCTION
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@3 pages deploy dist --project-name=ss-progress-track --branch=main --commit-hash="${{ needs.build.outputs.sha }}"
