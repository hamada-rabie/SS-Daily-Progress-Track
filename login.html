<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SS' Daily Progress Track — Login</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #0f766e, #134e4a);
      padding: 20px;
    }

    .login-card {
      width: 100%;
      max-width: 420px;
      background: white;
      border-radius: 20px;
      padding: 35px;
      box-shadow: 0 20px 50px rgba(0,0,0,.2);
    }

    h1 {
      margin: 0 0 8px;
      text-align: center;
      color: #134e4a;
      font-size: 28px;
    }

    .subtitle {
      text-align: center;
      color: #666;
      margin-bottom: 28px;
    }

    label {
      display: block;
      margin: 14px 0 7px;
      font-weight: bold;
      color: #333;
    }

    input {
      width: 100%;
      padding: 13px;
      border: 1px solid #ccc;
      border-radius: 10px;
      font-size: 16px;
    }

    button {
      width: 100%;
      margin-top: 22px;
      padding: 14px;
      border: 0;
      border-radius: 10px;
      background: #0f766e;
      color: white;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      background: #115e59;
    }

    #message {
      margin-top: 16px;
      text-align: center;
      font-size: 14px;
      min-height: 20px;
    }
  </style>
</head>

<body>

  <div class="login-card">
    <h1>SS' Daily Progress Track</h1>
    <div class="subtitle">Teacher Progress Command Center</div>

    <form id="loginForm">
      <label for="email">Email</label>
      <input
        id="email"
        type="email"
        placeholder="Enter your email"
        required
      >

      <label for="password">Password</label>
      <input
        id="password"
        type="password"
        placeholder="Enter your password"
        required
      >

      <button type="submit">Sign In</button>

      <div id="message"></div>
    </form>
  </div>

  <script type="module">
    import { initializeApp }
      from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";

    import {
      getAuth,
      signInWithEmailAndPassword
    } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyAlrLU20zWisISrmZKAMBNoAxclSA8B9iY",
      authDomain: "ss-daily-progress-track.firebaseapp.com",
      projectId: "ss-daily-progress-track",
      storageBucket: "ss-daily-progress-track.firebasestorage.app",
      messagingSenderId: "946203049271",
      appId: "1:946203049271:web:7534618a40b304ac722eb2",
      measurementId: "G-MH3X8WZW37"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);

    const form = document.getElementById("loginForm");
    const message = document.getElementById("message");

    form.addEventListener("submit", async (event) => {
      event.preventDefault();

      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;

      message.textContent = "Signing in...";

      try {
        await signInWithEmailAndPassword(auth, email, password);

        message.textContent = "Login successful. Opening app...";

        window.location.href =
          "english_dashboard-dynamic.html";

      } catch (error) {
        console.error(error);

        message.textContent =
          "Login failed. Please check your email and password.";
      }
    });
  </script>

</body>
</html>
