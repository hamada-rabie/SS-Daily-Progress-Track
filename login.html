<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0E7C74">
  <meta name="robots" content="noindex, nofollow">
  <title>SS' Daily Progress Track — Login</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
      margin: 0;
      padding: 0;
    }

    html {
      background: #134e4a;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #0f766e, #134e4a);
      padding: 20px;
      overflow: hidden;
      position: relative;
    }

    /* Prevent any accidental background content from showing */
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background: linear-gradient(135deg, #0f766e, #134e4a);
      z-index: 0;
    }

    .login-card {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 400px;
      max-height:none;
      overflow:hidden;
      background: #ffffff;
      border-radius: 18px;
      padding: 24px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, .2);
    }

    h1 {
      margin: 0 0 8px;
      text-align: center;
      color: #134e4a;
      font-size: 24px;
    }

    .subtitle {
      text-align: center;
      color: #666;
      margin-bottom: 18px;
    }

    label {
      display: block;
      margin: 10px 0 5px;
      font-weight: bold;
      color: #333;
    }

    .password-wrap {
      position: relative;
    }

    input {
      width: 100%;
      padding: 11px 46px 11px 12px;
      border: 1px solid #ccc;
      border-radius: 10px;
      font-size: 16px;
      outline: none;
      background: #ffffff;
      color: #222;
    }

    input:focus {
      border-color: #0f766e;
      box-shadow: 0 0 0 3px rgba(15, 118, 110, .1);
    }

    .toggle-password {
      position: absolute;
      right: 12px;
      top: 50%;
      transform: translateY(-50%);
      border: 0;
      background: transparent;
      color: #666;
      width: auto;
      margin: 0;
      padding: 5px;
      font-size: 19px;
      cursor: pointer;
    }

    .toggle-password:hover {
      background: transparent;
      color: #0f766e;
    }

    .forgot-wrap {
      text-align: right;
      margin-top: 10px;
    }

    .forgot-password {
      color: #0f766e;
      text-decoration: none;
      font-size: 14px;
      font-weight: bold;
      cursor: pointer;
    }

    .forgot-password:hover {
      text-decoration: underline;
    }

    .login-button {
      width: 100%;
      margin-top: 16px;
      padding: 11px;
      border: 0;
      border-radius: 10px;
      background: #0f766e;
      color: #ffffff;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
    }

     .secondary-button {
      width: 100%;
      margin-top: 10px;
      padding: 11px 13px;
      border: 1px solid #0f766e;
      border-radius: 10px;
      background: #ffffff;
      color: #0f766e;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
    }

    .secondary-button:hover {
      background: #effaf8;
    }

    .account-panel {
      display: none;
      margin-top: 14px;
      padding: 14px;
      border: 1px solid #d7ebe7;
      border-radius: 12px;
      background: #f8fcfb;
    }

    .account-panel.show { display: block; }
    .login-primary { display:block; }
    #loginForm.register-mode .login-primary { display:none !important; }
    #loginForm.register-mode #email,
    #loginForm.register-mode .password-wrap,
    #loginForm.register-mode button[type="submit"] { display:none !important; }
    #loginForm.register-mode #accountPanel { display:block; margin-top:0; }
    #loginForm.register-mode .subtitle { margin-bottom:10px; }
    #loginForm.register-mode .account-panel h2 { margin-bottom:8px; }
    #loginForm.register-mode .account-panel input { margin-top:7px; }

    .account-panel h2 { margin: 0 0 10px; font-size: 17px; color: #134e4a; text-align: center; }

    .account-panel input { margin-top: 8px; }

    .account-panel button { width: 100%; margin-top: 10px; }

    .login-button:hover {
      background: #115e59;
    }

    #message {
      margin-top: 16px;
      text-align: center;
      font-size: 14px;
      min-height: 20px;
      line-height: 1.5;
    }

    .success {
      color: #15803d;
    }

    .error {
      color: #b91c1c;
    }
  </style>
  <script>
    if('serviceWorker' in navigator){
      window.addEventListener('load',()=>{
        navigator.serviceWorker.register('firebase-messaging-sw.js',{scope:'./'})
          .catch(err=>console.warn('PWA service worker registration failed:',err));
      });
    }
  </script>
</head>

<body>

  <div class="login-card">

    <h1>SS' Daily Progress Track</h1>

    <div class="subtitle">
      Teacher Progress Command Center
    </div>

    <form id="loginForm">

      <label id="emailLabel" class="login-primary" for="email">Email</label>

      <input
        id="email"
        type="email"
        placeholder="Enter your email"
        autocomplete="email"
        required
      >

      <label id="passwordLabel" class="login-primary" for="password">Password</label>

      <div class="password-wrap login-primary">

        <input
          id="password"
          type="password"
          placeholder="Enter your password"
          autocomplete="current-password"
          required
        >

        <button
          type="button"
          class="toggle-password"
          id="togglePassword"
          aria-label="Show password"
          title="Show password"
        >👁️</button>

      </div>

      <div class="forgot-wrap login-primary">

        <a
          href="#"
          class="forgot-password"
          id="forgotPassword"
        >Forgot password?</a>

      </div>

      <button
        type="submit"
        class="login-button"
      >
        Sign In
      </button>

      <button type="button" id="createAccountButton" class="secondary-button login-primary">Create New Account / إنشاء حساب جديد</button>

      <div id="message"></div>

      <div id="accountPanel" class="account-panel">
        <h2>Create a new teacher account / إنشاء حساب معلم جديد</h2>
        <input id="newEmail" type="email" placeholder="Email / البريد الإلكتروني" autocomplete="email">
        <input id="newPassword" type="password" placeholder="Password (6+ characters) / كلمة المرور (6 أحرف فأكثر)" autocomplete="new-password">
        <input id="newPasswordConfirm" type="password" placeholder="Confirm password / تأكيد كلمة المرور" autocomplete="new-password">
        <button type="button" class="login-button" id="registerButton">Create Account / إنشاء الحساب</button>
        <button type="button" class="secondary-button" id="cancelRegisterButton">Cancel / إلغاء</button>
      </div>

    </form>

  </div>

  <script type="module">

    import { initializeApp }
      from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";

    import {
      getAuth,
      signInWithEmailAndPassword,
      createUserWithEmailAndPassword,
      sendPasswordResetEmail,
      setPersistence,
      browserLocalPersistence,
      signOut
    } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";

    import {
      getFirestore,
      doc,
      getDoc,
      setDoc
    } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyAlrLU20zWisISrmZKAMBNoAxclSA8B9iY",
      authDomain: "ss-daily-progress-track.firebaseapp.com",
      projectId: "ss-daily-progress-track",
      storageBucket: "ss-daily-progress-track.firebasestorage.app",
      messagingSenderId: "946203049271",
      appId: "1:946203049271:web:7534618a40b304ac722eb2",
      measurementId: "G-MH3X8WZW37"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);
    const db = getFirestore(app);

    const form = document.getElementById("loginForm");
    const emailInput = document.getElementById("email");
    const passwordInput = document.getElementById("password");
    const message = document.getElementById("message");
    const togglePassword = document.getElementById("togglePassword");
    const forgotPassword = document.getElementById("forgotPassword");
    const createAccountButton = document.getElementById("createAccountButton");
    const accountPanel = document.getElementById("accountPanel");
    const registerButton = document.getElementById("registerButton");
    const cancelRegisterButton = document.getElementById("cancelRegisterButton");
    const newEmail = document.getElementById("newEmail");
    const newPassword = document.getElementById("newPassword");
    const newPasswordConfirm = document.getElementById("newPasswordConfirm");

    /* Show / Hide Password */

    togglePassword.addEventListener("click", () => {

      const isHidden =
        passwordInput.type === "password";

      passwordInput.type =
        isHidden ? "text" : "password";

      togglePassword.textContent =
        isHidden ? "🙈" : "👁️";

      togglePassword.setAttribute(
        "aria-label",
        isHidden ? "Hide password" : "Show password"
      );

      togglePassword.setAttribute(
        "title",
        isHidden ? "Hide password" : "Show password"
      );

    });


    createAccountButton.addEventListener("click", () => {
      accountPanel.classList.add("show");
      form.classList.add("register-mode");
      newEmail.value = "";
      newEmail.focus();
      message.className = "";
      message.textContent = "";
    });

    cancelRegisterButton.addEventListener("click", () => {
      accountPanel.classList.remove("show");
      form.classList.remove("register-mode");
      newPassword.value = "";
      newPasswordConfirm.value = "";
      message.className = "";
      message.textContent = "";
    });

    registerButton.addEventListener("click", async () => {
      const email = newEmail.value.trim();
      const password = newPassword.value;
      const confirm = newPasswordConfirm.value;
      if(!email || !password){ message.className="error"; message.textContent="Please enter email and password."; return; }
      if(password.length < 6){ message.className="error"; message.textContent="Password must be at least 6 characters."; return; }
      if(password !== confirm){ message.className="error"; message.textContent="Passwords do not match."; return; }
      message.className = "";
      message.textContent = "Creating account...";
      registerButton.disabled = true;
      try {
        await setPersistence(auth, browserLocalPersistence);
        const credential = await createUserWithEmailAndPassword(auth, email, password);
        const user = credential.user;
        const now = new Date().toISOString();
        await setDoc(doc(db, "users", user.uid), {
          uid: user.uid,
          email: user.email || email,
          status: "pending",
          role: "teacher",
          createdAt: now,
          updatedAt: now
        }, { merge: true });
        await setDoc(doc(db, "accessRequests", user.uid), {
          uid: user.uid,
          email: user.email || email,
          status: "pending",
          createdAt: now,
          updatedAt: now
        }, { merge: true });
        await signOut(auth);
        message.className = "success";
        message.innerHTML = "Account created successfully.<br><strong>Your access request is now pending admin approval.</strong><br>تم إنشاء الحساب، وطلبك الآن في انتظار موافقة المسؤول.";
        accountPanel.classList.remove("show");
        form.classList.remove("register-mode");
      } catch(error) {
        console.error(error);
        message.className = "error";
        if(error.code === "auth/email-already-in-use") message.textContent = "This email already has an account. Please sign in instead.";
        else if(error.code === "auth/invalid-email") message.textContent = "Please enter a valid email address.";
        else if(error.code === "auth/weak-password") message.textContent = "Password is too weak. Use at least 6 characters.";
        else message.textContent = "Account creation failed. Please try again.";
      } finally { registerButton.disabled = false; }
    });

    /* Sign In */

    form.addEventListener("submit", async (event) => {

      event.preventDefault();

      const email =
        emailInput.value.trim();

      const password =
        passwordInput.value;

      message.className = "";
      message.textContent =
        "Signing in...";

      try {

        await setPersistence(auth, browserLocalPersistence);

        const credential = await signInWithEmailAndPassword(auth, email, password);
        const user = credential.user;
        const profileSnap = await getDoc(doc(db, "users", user.uid));
        const profile = profileSnap.exists() ? profileSnap.data() : null;
        const status = profile?.status || "pending";

        if(status !== "approved"){
          await signOut(auth);
          message.className = status === "denied" ? "error" : "success";
          if(status === "denied"){
            message.innerHTML = "Access denied by the administrator.<br>تم رفض طلب الوصول. يمكنك التواصل مع مسؤول التطبيق.";
          }else{
            message.innerHTML = "Your account is pending admin approval.<br>حسابك في انتظار موافقة مسؤول التطبيق قبل الدخول."; 
          }
          return;
        }

        message.className = "success";
        message.textContent = "Login successful. Opening app...";
        window.location.href = "english_dashboard-dynamic.html";

      } catch (error) {

        console.error(error);

        message.className =
          "error";

        if (
          error.code ===
          "auth/invalid-credential"
        ) {

          message.textContent =
            "Incorrect email or password.";

        } else if (
          error.code ===
          "auth/too-many-requests"
        ) {

          message.textContent =
            "Too many attempts. Please try again later.";

        } else {

          message.textContent =
            "Login failed. Please check your email and password.";

        }

      }

    });


    /* Forgot Password */

    forgotPassword.addEventListener(
      "click",
      async (event) => {

        event.preventDefault();

        const email =
          emailInput.value.trim();

        if (!email) {

          message.className =
            "error";

          message.textContent =
            "Please enter your email first.";

          emailInput.focus();

          return;
        }

        message.className = "";

        message.textContent =
          "Sending password reset email...";

        try {

          await sendPasswordResetEmail(
            auth,
            email
          );

          message.className =
            "success";

          message.textContent =
            "Password reset email sent. Please check your inbox.";

        } catch (error) {

          console.error(error);

          message.className =
            "error";

          if (
            error.code ===
            "auth/user-not-found"
          ) {

            message.textContent =
              "No account was found with this email.";

          } else if (
            error.code ===
            "auth/invalid-email"
          ) {

            message.textContent =
              "Please enter a valid email address.";

          } else {

            message.textContent =
              "Could not send the reset email. Please try again.";

          }

        }

      }
    );

  </script>

</body>
</html>
