```html
<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SS' Daily Progress Track — Login</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #0f766e, #134e4a);
      padding: 20px;
    }

    .login-card {
      width: 100%;
      max-width: 420px;
      background: white;
      border-radius: 20px;
      padding: 35px;
      box-shadow: 0 20px 50px rgba(0,0,0,.2);
    }

    h1 {
      margin: 0 0 8px;
      text-align: center;
      color: #134e4a;
      font-size: 28px;
    }

    .subtitle {
      text-align: center;
      color: #666;
      margin-bottom: 28px;
    }

    label {
      display: block;
      margin: 14px 0 7px;
      font-weight: bold;
      color: #333;
    }

    .password-wrap {
      position: relative;
    }

    input {
      width: 100%;
      padding: 13px 46px 13px 13px;
      border: 1px solid #ccc;
      border-radius: 10px;
      font-size: 16px;
      outline: none;
    }

    input:focus {
      border-color: #0f766e;
      box-shadow: 0 0 0 3px rgba(15,118,110,.1);
    }

    .toggle-password {
      position: absolute;
      right: 12px;
      top: 50%;
      transform: translateY(-50%);
      border: 0;
      background: transparent;
      color: #666;
      width: auto;
      margin: 0;
      padding: 5px;
      font-size: 19px;
      cursor: pointer;
    }

    .toggle-password:hover {
      background: transparent;
      color: #0f766e;
    }

    .forgot-wrap {
      text-align: right;
      margin-top: 10px;
    }

    .forgot-password {
      color: #0f766e;
      text-decoration: none;
      font-size: 14px;
      font-weight: bold;
      cursor: pointer;
    }

    .forgot-password:hover {
      text-decoration: underline;
    }

    .login-button {
      width: 100%;
      margin-top: 22px;
      padding: 14px;
      border: 0;
      border-radius: 10px;
      background: #0f766e;
      color: white;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
    }

    .login-button:hover {
      background: #115e59;
    }

    #message {
      margin-top: 16px;
      text-align: center;
      font-size: 14px;
      min-height: 20px;
      line-height: 1.5;
    }

    .success {
      color: #15803d;
    }

    .error {
      color: #b91c1c;
    }
  </style>
</head>

<body>

  <div class="login-card">
    <h1>SS' Daily Progress Track</h1>
    <div class="subtitle">Teacher Progress Command Center</div>

    <form id="loginForm">

      <label for="email">Email</label>
      <input
        id="email"
        type="email"
        placeholder="Enter your email"
        autocomplete="email"
        required
      >

      <label for="password">Password</label>

      <div class="password-wrap">
        <input
          id="password"
          type="password"
          placeholder="Enter your password"
          autocomplete="current-password"
          required
        >

        <button
          type="button"
          class="toggle-password"
          id="togglePassword"
          aria-label="Show password"
          title="Show password"
        >👁️</button>
      </div>

      <div class="forgot-wrap">
        <a
          href="#"
          class="forgot-password"
          id="forgotPassword"
        >Forgot password?</a>
      </div>

      <button type="submit" class="login-button">
        Sign In
      </button>

      <div id="message"></div>

    </form>
  </div>

  <script type="module">

    import { initializeApp }
      from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";

    import {
      getAuth,
      signInWithEmailAndPassword,
      sendPasswordResetEmail
    } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyAlrLU20zWisISrmZKAMBNoAxclSA8B9iY",
      authDomain: "ss-daily-progress-track.firebaseapp.com",
      projectId: "ss-daily-progress-track",
      storageBucket: "ss-daily-progress-track.firebasestorage.app",
      messagingSenderId: "946203049271",
      appId: "1:946203049271:web:7534618a40b304ac722eb2",
      measurementId: "G-MH3X8WZW37"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);

    const form = document.getElementById("loginForm");
    const emailInput = document.getElementById("email");
    const passwordInput = document.getElementById("password");
    const message = document.getElementById("message");
    const togglePassword = document.getElementById("togglePassword");
    const forgotPassword = document.getElementById("forgotPassword");

    // Show / Hide Password
    togglePassword.addEventListener("click", () => {

      const isHidden = passwordInput.type === "password";

      passwordInput.type = isHidden ? "text" : "password";

      togglePassword.textContent = isHidden ? "🙈" : "👁️";

      togglePassword.setAttribute(
        "aria-label",
        isHidden ? "Hide password" : "Show password"
      );

      togglePassword.setAttribute(
        "title",
        isHidden ? "Hide password" : "Show password"
      );

    });

    // Sign In
    form.addEventListener("submit", async (event) => {

      event.preventDefault();

      const email = emailInput.value.trim();
      const password = passwordInput.value;

      message.className = "";
      message.textContent = "Signing in...";

      try {

        await signInWithEmailAndPassword(
          auth,
          email,
          password
        );

        message.className = "success";
        message.textContent =
          "Login successful. Opening app...";

        window.location.href =
          "english_dashboard-dynamic.html";

      } catch (error) {

        console.error(error);

        message.className = "error";

        if (error.code === "auth/invalid-credential") {
          message.textContent =
            "Incorrect email or password.";
        } else if (error.code === "auth/too-many-requests") {
          message.textContent =
            "Too many attempts. Please try again later.";
        } else {
          message.textContent =
            "Login failed. Please check your email and password.";
        }

      }

    });

    // Forgot Password
    forgotPassword.addEventListener("click", async (event) => {

      event.preventDefault();

      const email = emailInput.value.trim();

      if (!email) {

        message.className = "error";
        message.textContent =
          "Please enter your email first.";

        emailInput.focus();
        return;
      }

      message.className = "";
      message.textContent =
        "Sending password reset email...";

      try {

        await sendPasswordResetEmail(
          auth,
          email
        );

        message.className = "success";
        message.textContent =
          "Password reset email sent. Please check your inbox.";

      } catch (error) {

        console.error(error);

        message.className = "error";

        if (error.code === "auth/user-not-found") {
          message.textContent =
            "No account was found with this email.";
        } else if (error.code === "auth/invalid-email") {
          message.textContent =
            "Please enter a valid email address.";
        } else {
          message.textContent =
            "Could not send the reset email. Please try again.";
        }

      }

    });

  </script>

</body>
</html>
